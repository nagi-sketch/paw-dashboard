<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>ダッシュボード</title><style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#222;--sub:#666;--line:#ddd;--accent:#c2185b;--err:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--card:#222;--ink:#eee;--sub:#aaa;--line:#444;--accent:#f06292;--err:#ef5350}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;line-break:strict;word-break:keep-all}
main{max-width:380px;margin:12vh auto 0;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
h1{font-size:18px;margin:0 0 4px}p{color:var(--sub);font-size:14px;margin:0 0 16px}
input[type=password]{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{width:100%;margin-top:12px;padding:12px;font-size:16px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--sub);margin-top:12px}
#msg{color:var(--err);font-size:14px;min-height:20px;margin-top:8px}
a{display:block;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}a:last-child{border:0}</style></head><body><main><div class="card">
<h1>ダッシュボード</h1><p>開くには<wbr>店舗ごとの<wbr>パスワードが<wbr>要ります</p>
<a href="all/">全店（管理者用）</a>
<a href="toyama/">富山店</a>
<a href="futakuchi/">二口店</a>
<a href="takaoka/">高岡店</a>
<a href="kanazawa/">金沢店</a>
<a href="okyozuka/">御経塚店</a>
<a href="shizuoka/">静岡店</a>
<a href="hachioji/">八王子店</a>
</div></main></body></html>
