const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(E.salt),iterations:E.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:d(E.iv)},key,d(E.ct)));
  document.open();document.write(html);document.close();
}
const msg=document.getElementById('msg');
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();const pw=document.getElementById('pw').value,keep=document.getElementById('keep').checked;msg.textContent='開いています…';
  try{await open_(pw);try{keep?localStorage.setItem(K,pw):localStorage.removeItem(K)}catch(_){}}

};
(async()=>{let s;try{s=localStorage.getItem(K)}catch(_){}
